<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sulla Via</title>
    <!-- Applies the saved theme before the first paint, so a dark-mode
         visitor gets no light flash. Mirrors lib/theme.ts's applyTheme. -->
    <script>
      try {
        var theme = localStorage.getItem("waypointer.theme")
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Tally's popup-form runtime, triggered via data-tally-open on
         FeedbackWidget's button - see lib/feedbackConfig.ts -->
    <script async src="https://tally.so/widgets/embed.js"></script>
  </body>
</html>
